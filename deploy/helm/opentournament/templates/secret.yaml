{{- $data := dict }}
{{- if not .Values.database.existingSecret }}
{{- $_ := set $data "OT_DATABASE_URL" (.Values.database.url | b64enc) }}
{{- end }}
{{- if not .Values.matchTokenKey.existingSecret }}
{{- $key := .Values.matchTokenKey.value | b64enc }}
{{- if not .Values.matchTokenKey.value }}
{{- /* Every replica, and every upgrade, must keep signing with the same key. */}}
{{- $existing := lookup "v1" "Secret" (include "opentournament.namespace" .) (include "opentournament.fullname" .) }}
{{- $key = dig "data" "OT_MATCH_TOKEN_KEY" (randAscii 48 | b64enc | b64enc) $existing }}
{{- end }}
{{- $_ := set $data "OT_MATCH_TOKEN_KEY" $key }}
{{- end }}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opentournament.fullname" . }}
  namespace: {{ include "opentournament.namespace" . }}
  labels:
    {{- include "opentournament.labels" . | nindent 4 }}
type: Opaque
data:
  {{- toYaml $data | nindent 2 }}
{{- end }}
