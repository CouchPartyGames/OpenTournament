# The Tournament Manifest (ADR-0005): a Tournament's desired configuration and
# its Organizer. The spec takes the same settings, with the same bounds, as
# POST /api/v1/tournaments; runtime state never lives here.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tournaments.opentournament.io
spec:
  group: opentournament.io
  scope: Namespaced
  names:
    kind: Tournament
    listKind: TournamentList
    plural: tournaments
    singular: tournament
    categories: [opentournament]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Status
          type: string
          jsonPath: .status.tournamentStatus
        - name: Starts
          type: string
          jsonPath: .spec.startsAt
        - name: Tournament ID
          type: string
          jsonPath: .status.tournamentId
        - name: Synced
          type: string
          jsonPath: .status.conditions[?(@.type=="Synced")].status
          priority: 1
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Synced")].reason
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [organizer, gameId, name, startsAt, registrationOpensAt, capacity, minimumParticipants, stages]
              properties:
                organizer:
                  type: string
                  pattern: '^(user|client):.+$'
                  description: "The Organizer: user:<keycloak subject> or client:<keycloak client id>."
                gameId:
                  type: string
                  minLength: 1
                  description: The Game the Tournament is played in.
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                startsAt:
                  type: string
                  format: date-time
                  description: When the Tournament starts, automatically.
                registrationOpensAt:
                  type: string
                  format: date-time
                  description: When the Registration Window opens; it closes at the start.
                capacity:
                  type: integer
                  format: int32
                  minimum: 2
                  maximum: 100000
                  description: The most Participants accepted, first come, first served.
                minimumParticipants:
                  type: integer
                  format: int32
                  minimum: 2
                  description: Below this many at the start, the Tournament is cancelled.
                checkIn:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      description: Participants must check in or are dropped at the start.
                    windowSeconds:
                      type: integer
                      format: int32
                      minimum: 0
                      description: Length of the Check-in Window, ending at the start.
                stages:
                  type: array
                  minItems: 1
                  maxItems: 10
                  description: The Stages, played in order.
                  items:
                    type: object
                    required: [format, resultDeadlineSeconds]
                    properties:
                      format:
                        type: string
                        enum: [single-elimination, double-elimination, round-robin, swiss, free-for-all]
                      groups:
                        type: integer
                        format: int32
                        minimum: 1
                        maximum: 1024
                        default: 1
                        description: Groups the Stage is split into.
                      advancement:
                        type: integer
                        format: int32
                        minimum: 0
                        description: Participants per Group who advance to the next Stage; 0 on the last Stage.
                      bestOf:
                        type: integer
                        format: int32
                        enum: [1, 3]
                        description: "Head-to-head Formats: Bouts per Match."
                      bouts:
                        type: integer
                        format: int32
                        minimum: 1
                        maximum: 100
                        description: "Free-for-all: Bouts per Match."
                      swissRounds:
                        type: integer
                        format: int32
                        minimum: 0
                        maximum: 100
                        description: "Swiss: overrides the default ⌈log₂ N⌉ Rounds."
                      resultDeadlineSeconds:
                        type: integer
                        format: int32
                        minimum: 60
                        maximum: 604800
                        description: Time a Match has to complete, from when it is Ready.
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  description: The generation of the spec last reconciled.
                tournamentId:
                  type: string
                  description: The declared Tournament, as the API names it.
                tournamentStatus:
                  type: string
                  description: The declared Tournament's status, e.g. draft.
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
