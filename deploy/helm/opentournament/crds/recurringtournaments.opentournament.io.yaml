# The Recurring Tournament: a Tournament template and a schedule in a time
# zone. It declares one Tournament per Occurrence within its lookahead window.
# The template takes the same settings, with the same bounds, as
# POST /api/v1/tournaments, less the two absolute times; runtime state never
# lives here.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: recurringtournaments.opentournament.io
spec:
  group: opentournament.io
  scope: Namespaced
  names:
    kind: RecurringTournament
    listKind: RecurringTournamentList
    plural: recurringtournaments
    singular: recurringtournament
    categories: [opentournament]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Schedule
          type: string
          jsonPath: .spec.schedule
        - name: Time Zone
          type: string
          jsonPath: .spec.timeZone
        - name: Suspend
          type: boolean
          jsonPath: .spec.suspend
        - name: Last Schedule
          type: date
          jsonPath: .status.lastScheduleTime
        - name: Synced
          type: string
          jsonPath: .status.conditions[?(@.type=="Synced")].status
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Synced")].reason
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [schedule, timeZone, template]
              properties:
                schedule:
                  type: string
                  minLength: 1
                  description: 'When each Tournament starts, as a five-field cron expression such as "0 20 * * 1-5", read in timeZone.'
                timeZone:
                  type: string
                  minLength: 1
                  description: An IANA time zone such as UTC or Europe/Berlin.
                lookahead:
                  type: string
                  pattern: '^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$'
                  description: Tournaments starting within this window are declared, as a duration such as 48h. Defaults to 24h.
                suspend:
                  type: boolean
                  default: false
                  description: Stops declaring new Tournaments, like a suspended CronJob. Those already declared are kept.
                template:
                  type: object
                  required: [organizer, gameId, name, registrationOpensBefore, capacity, minimumParticipants, stages]
                  description: The Tournament each Occurrence declares, less its two absolute times.
                  properties:
                    organizer:
                      type: string
                      pattern: '^(user|client):.+$'
                      description: "The Organizer: user:<keycloak subject> or client:<keycloak client id>."
                    gameId:
                      type: string
                      minLength: 1
                      description: The Game the Tournament is played in.
                    name:
                      type: string
                      minLength: 1
                      # 200, less the start appended to each Tournament's name.
                      maxLength: 183
                      description: Each Tournament's name is this and its start in timeZone, e.g. "Weeknight Cup 2026-10-02 20:00".
                    registrationOpensBefore:
                      type: string
                      pattern: '^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$'
                      description: How long before each start the Registration Window opens, as a duration such as 30m.
                    capacity:
                      type: integer
                      format: int32
                      minimum: 2
                      maximum: 100000
                      description: The most Participants accepted, first come, first served.
                    minimumParticipants:
                      type: integer
                      format: int32
                      minimum: 2
                      description: Below this many at the start, the Tournament is cancelled.
                    checkIn:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          description: Participants must check in or are dropped at the start.
                        windowSeconds:
                          type: integer
                          format: int32
                          minimum: 0
                          description: Length of the Check-in Window, ending at the start.
                    stages:
                      type: array
                      minItems: 1
                      maxItems: 10
                      description: The Stages, played in order.
                      items:
                        type: object
                        required: [format, resultDeadlineSeconds]
                        properties:
                          format:
                            type: string
                            enum: [single-elimination, double-elimination, round-robin, swiss, free-for-all]
                          groups:
                            type: integer
                            format: int32
                            minimum: 1
                            maximum: 1024
                            default: 1
                            description: Groups the Stage is split into.
                          advancement:
                            type: integer
                            format: int32
                            minimum: 0
                            description: Participants per Group who advance to the next Stage; 0 on the last Stage.
                          bestOf:
                            type: integer
                            format: int32
                            enum: [1, 3]
                            description: "Head-to-head Formats: Bouts per Match."
                          bouts:
                            type: integer
                            format: int32
                            minimum: 1
                            maximum: 100
                            description: "Free-for-all: Bouts per Match."
                          swissRounds:
                            type: integer
                            format: int32
                            minimum: 0
                            maximum: 100
                            description: "Swiss: overrides the default ⌈log₂ N⌉ Rounds."
                          resultDeadlineSeconds:
                            type: integer
                            format: int32
                            minimum: 60
                            maximum: 604800
                            description: Time a Match has to complete, from when it is Ready.
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  description: The latest generation whose Occurrences are declared.
                lastScheduleTime:
                  type: string
                  format: date-time
                  description: The start of the latest Tournament declared.
                upcoming:
                  type: array
                  description: The declared Tournaments within the lookahead window that haven't started, earliest first.
                  items:
                    type: object
                    required: [startsAt, tournamentId, tournamentStatus]
                    properties:
                      startsAt:
                        type: string
                        format: date-time
                      tournamentId:
                        type: string
                        description: The Tournament, as the API names it.
                      tournamentStatus:
                        type: string
                        description: The Tournament's status, e.g. draft.
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
