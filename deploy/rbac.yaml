# What the service needs from Kubernetes (ADR-0001): create
# GameServerAllocations, and get, list, watch, patch and delete GameServers,
# in each namespace a Game's Fleet lives in. Repeat the Role and RoleBinding
# per Fleet namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opentournament
  namespace: opentournament
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opentournament
  namespace: games
rules:
  - apiGroups: ["allocation.agones.dev"]
    resources: ["gameserverallocations"]
    verbs: ["create"]
  - apiGroups: ["agones.dev"]
    resources: ["gameservers"]
    verbs: ["get", "list", "watch", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opentournament
  namespace: games
subjects:
  - kind: ServiceAccount
    name: opentournament
    namespace: opentournament
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opentournament
