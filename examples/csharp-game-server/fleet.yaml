# Replaces the arena Fleet from ../kubernetes/fleet.yaml for this reference server.
apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: arena
  namespace: default
spec:
  replicas: 2
  template:
    spec:
      health:
        initialDelaySeconds: 10
        periodSeconds: 5
        failureThreshold: 3
      ports:
        - name: default
          containerPort: 7654
      template:
        spec:
          containers:
            - name: game-server
              image: opentournament-game-server:issue24
              imagePullPolicy: IfNotPresent
              env:
                - name: OPENTOURNAMENT_API_URL
                  value: http://ot-opentournament.opentournament.svc.cluster.local
              resources:
                requests:
                  memory: 64Mi
                  cpu: 20m
                limits:
                  memory: 128Mi
                  cpu: 200m
