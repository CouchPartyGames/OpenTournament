name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check OpenAPI document for drift
        run: make openapi-check
      # The integration tests start PostgreSQL through testcontainers,
      # using the runner's Docker daemon.
      - run: make vet test

  csharp-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/csharp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore AgonesTournament.Sdk.slnx
      - run: dotnet build AgonesTournament.Sdk.slnx -c Release --no-restore
      - run: dotnet test AgonesTournament.Sdk.slnx -c Release --no-build
      - run: dotnet pack AgonesTournament.Sdk.slnx -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: csharp-sdk-packages
          path: sdks/csharp/artifacts/*.nupkg
          if-no-files-found: error

  csharp-game-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build examples/csharp-game-server/GameServer.cs -c Release
      - run: dotnet test sdks/csharp/AgonesTournament.Sdk.slnx -c Release
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/csharp-game-server/Dockerfile
          push: false
          tags: opentournament-game-server:ci

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Lint and render
        run: |
          for values in deploy/helm/opentournament/ci/*.yaml; do
            helm lint --strict deploy/helm/opentournament -f "$values"
            helm template ot deploy/helm/opentournament -f "$values" > /dev/null
          done

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe needs the tags and history.
          fetch-depth: 0
      - id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # latest is added automatically for semver tags.
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Released charts install the image of the same version.
  chart-publish:
    needs: [chart, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package and push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm package deploy/helm/opentournament --version "$version" --app-version "$version"
          helm push "opentournament-$version.tgz" "oci://ghcr.io/${OWNER,,}/charts"
